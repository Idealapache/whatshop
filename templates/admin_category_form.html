{% extends "base.html" %}
{% block content %}
<div class="admin-shell narrow">
    <a href="/admin/categories" class="back">← Back</a>
    <h1>{% if category %}Edit{% else %}New{% endif %} category</h1>
    <form method="post" class="form-section">
        <label>Name<input type="text" name="name" value="{{ category.name if category else '' }}" required></label>
        <label>Slug<input type="text" name="slug" value="{{ category.slug if category else '' }}" placeholder="chairs" required></label>
        <label>Sort order<input type="number" name="sort_order" value="{{ category.sort_order if category else 0 }}"></label>
        <button type="submit" class="btn btn-primary">Save</button>
    </form>
</div>
{% endblock %}
