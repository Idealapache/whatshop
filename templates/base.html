<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.BUSINESS_NAME }}{% endblock %}</title>
    <meta property="og:title" content="{{ config.BUSINESS_NAME }}">
    <meta property="og:description" content="Event rentals for birthdays, weddings, proposals, and more.">
    <link rel="stylesheet" href="/static/style.css">
    <script>window.CONFIG = { businessName: "{{ config.BUSINESS_NAME }}" };</script>
</head>
<body>
    <header class="site-header">
        <a href="/" class="brand">{{ config.BUSINESS_NAME }}</a>
        <nav class="header-nav">
            <a href="/shop">Shop by Item</a>
            <a href="/events">Shop by Event</a>
            <a href="/selection" class="cart-link">Selection (<span id="sel-count">0</span>)</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
        function updateSelCount() {
            try {
                const cart = JSON.parse(localStorage.getItem("selection") || "[]");
                const count = cart.reduce((s, i) => s + i.qty, 0);
                const el = document.getElementById("sel-count");
                if (el) el.textContent = count;
            } catch(e) {}
        }
        updateSelCount();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
